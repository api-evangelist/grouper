name: Grouper
description: >-
  Grouper, operated by Element3 Health, Inc. (d/b/a Grouper) and headquartered in
  Boston, Massachusetts, is a healthy-aging benefit company that connects older
  adults to social clubs, group activities, and virtual community programming
  through health plans. Its consumer product, "Hello by Grouper," is a
  membership platform offering live and on-demand instructor-led virtual
  classes, research-based monthly brain-health challenges, and members-only
  online events, with the goal of keeping members active, socially connected,
  and healthier as they age. Grouper distributes primarily through Medicare
  Advantage and other health-plan partners rather than a direct developer
  channel; it publishes no public developer portal, API, or SDK surface as of
  this profile, which was added to the API Evangelist network as a venture
  (a16z-associated) portfolio lead.
